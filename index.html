<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mom or Dad?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
<style>
  :root {
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: Inter, system-ui, sans-serif;
    --ink: #f4f1ea; --muted: #8a8a8a; --line: rgba(255,255,255,.10); --glass: rgba(255,255,255,.055);
    --cw: clamp(150px, 17.5vw, 270px);      /* carousel card width  */
    --ch: calc(var(--cw) * 1.3);            /* carousel card height */
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; background: #000; color: var(--ink); font-family: var(--sans); overflow-x: clip; }

  /* ───────── floating pill nav ───────── */
  nav { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 50;
        width: min(740px, calc(100% - 28px)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        padding: 7px 7px 7px 20px; border-radius: 16px; background: rgba(255,255,255,.055);
        border: 1px solid rgba(255,255,255,.06); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 10px 40px rgba(0,0,0,.5); font-size: 12px; }
  nav .brand { font: 400 18px var(--serif); letter-spacing: .01em; white-space: nowrap; }
  nav .links { display: flex; gap: 26px; }
  nav .links a { color: #7d7d7d; text-decoration: none; cursor: pointer; font-weight: 400; transition: color .2s; white-space: nowrap; }
  nav .links a.on, nav .links a:hover { color: #fff; font-weight: 500; }
  nav .cta { justify-self: end; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
             background: linear-gradient(180deg, #2c2c2e, #1f1f21); color: #fff; font: 500 12px var(--sans);
             border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 11px 18px;
             box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transition: background .2s, border-color .2s; }
  nav .cta:hover { background: linear-gradient(180deg, #3a3a3d, #2a2a2c); border-color: rgba(255,255,255,.3); }

  /* ───────── landing hero ───────── */
  #landing { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center;
             text-align: center; padding-top: clamp(120px, 17vh, 170px); overflow: hidden; }
  h1.hero { font: 400 clamp(30px, 4.2vw, 56px)/1.14 var(--serif); letter-spacing: .005em; margin: 0; max-width: 640px; padding: 0 20px;
            opacity: 0; transform: translateY(14px); animation: rise 1.1s .1s cubic-bezier(.2,.7,.2,1) forwards; }
  .sub { color: var(--muted); font-size: 12.5px; font-weight: 300; margin: 18px 0 0; max-width: 440px; padding: 0 20px; line-height: 1.6;
         opacity: 0; animation: rise 1.1s .3s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* curved gallery: cards bend toward the viewer at both edges, like the reference video */
  #stage { position: relative; width: 100%; flex: 1; min-height: calc(var(--ch) + 90px); margin-top: 22px;
           perspective: 1000px; perspective-origin: 50% 50%; }
  .card { position: absolute; left: 50%; top: 50%; width: var(--cw); height: var(--ch); margin: calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2);
          border-radius: 3px; overflow: hidden; background: #0d0d0e; will-change: transform; backface-visibility: hidden; }
  .card img, .card svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap { position: absolute; left: 0; right: 0; bottom: 22px; color: #555; font-size: 11px; letter-spacing: .04em; cursor: pointer; }
  .cap:hover { color: #888; }
  #landing { position: relative; }

  /* ───────── two pages: 1) hero carousel, 2) the app ───────── */
  #landing, #appWrap { transition: opacity .45s ease; }
  body.leaving #landing, body.leaving #appWrap { opacity: 0; }
  body.page-app #landing { display: none; }
  /* while on the hero, the app loads off-screen in the background */
  body:not(.page-app) #appWrap { position: fixed; left: -10000px; top: 0; width: 980px; visibility: hidden; pointer-events: none; }
  body.page-app nav .cta { visibility: hidden; }
  #appWrap { position: relative; padding: 120px 16px 80px; min-height: 100vh; }
  #appWrap .reveal { opacity: 0; transform: translateY(24px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
  #appWrap.ready .reveal { opacity: 1; transform: none; }
  #boot { text-align: center; color: #666; font-size: 12px; letter-spacing: .06em; padding-top: 40px; }
  #boot::after { content: ""; display: block; width: 28px; height: 1px; margin: 16px auto 0; background: #888; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .15; transform: scaleX(.4); } 50% { opacity: 1; transform: scaleX(1); } }

  /* ───────── Streamlit skin (same black, serif, glass as the hero) ───────── */
  .stApp, [data-testid="stAppViewContainer"], [data-testid="stMain"], [data-testid="stMainBlockContainer"], section.main
      { background: transparent !important; position: static !important; height: auto !important; min-height: 0 !important; overflow: visible !important; }
  [data-testid="stHeader"], [data-testid="stToolbar"], [data-testid="stDecoration"], [data-testid="stStatusWidget"], footer, #MainMenu { display: none !important; }
  .block-container { padding: 0 !important; max-width: 980px !important; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--serif) !important; font-weight: 400 !important; letter-spacing: 0 !important; color: var(--ink) !important; }
  h1 { font-size: clamp(34px, 4vw, 46px) !important; text-align: center; padding-top: 0 !important; }
  h2, h3 { font-size: 28px !important; }
  [data-testid="stCaptionContainer"], .stCaption, small { color: #777 !important; }
  .stButton button, .stDownloadButton button { border-radius: 12px; background: linear-gradient(180deg, #2c2c2e, #1f1f21); color: #fff;
          border: 1px solid rgba(255,255,255,.14); padding: 12px 18px; font-weight: 500; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transition: all .2s; }
  .stButton button:hover { background: linear-gradient(180deg, #3a3a3d, #2a2a2c); border-color: rgba(255,255,255,.35); color: #fff; }
  .stButton button[kind="primary"] { background: #f4f1ea; color: #000; border-color: #f4f1ea; }
  .stButton button[kind="primary"]:hover { background: #fff; }
  .stButton button:disabled { opacity: .35; }
  [data-testid="stVerticalBlockBorderWrapper"] { background: var(--glass); border: 1px solid var(--line) !important; border-radius: 18px; padding: 10px 8px; }
  [data-testid="stFileUploaderDropzone"], [data-testid="stCameraInput"] { background: rgba(255,255,255,.04); border: 1px dashed rgba(255,255,255,.16); border-radius: 14px; }
  [data-testid="stAlert"] { background: var(--glass) !important; border: 1px solid var(--line); border-radius: 14px; }
  [data-testid="stAlertContainer"], [data-testid="stAlert"] p { background: transparent !important; color: var(--ink) !important; }
  [data-baseweb="tab-list"] { gap: 6px; }
  [data-baseweb="tab-highlight"] { background: #f4f1ea !important; }
  [data-testid="stProgress"] div[role="progressbar"] > div { background: #f4f1ea !important; }
  .steps { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 26px; font-size: 12px; }
  .steps span { padding: 7px 15px; border-radius: 99px; border: 1px solid var(--line); color: #666; }
  .steps span.on { color: #fff; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); }

  @media (max-width: 640px) {
    nav .links { display: none; } nav { grid-template-columns: 1fr auto; }
    h1.hero { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<nav>
  <b class="brand">Mom or Dad?</b>
  <div class="links"><a class="on" id="nHome">Home</a><a id="nHow">How it works</a><a id="nData">Dataset</a></div>
  <button class="cta" id="nStart">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.4 11.1 21.4 2.6c.8-.4 1.6.4 1.2 1.2L14.1 22.8c-.4.9-1.7.8-1.9-.2l-1.8-7.6a1 1 0 0 0-.8-.8l-7.6-1.8c-1-.2-1.1-1.5-.2-1.9z"/></svg>
    Get started
  </button>
</nav>

<section id="landing">
  <h1 class="hero">Discover who your face really takes after</h1>
  <p class="sub">A face-space model trained on 776 real families from the TSKinFace dataset. Press Get started to add your photos and see the resemblance.</p>
  <div id="stage"></div>
  <div class="cap" id="dataset">Faces from the TSKinFace dataset</div>
</section>

<section id="appWrap">
  <div id="boot">Loading the face model</div>
  <div class="reveal"><div id="app"><div id="root"></div></div></div>
</section>

<!-- ───────── 1. curved carousel (no dependencies; cards appear instantly, photos swap in as they load) ───────── -->
<script>
(() => {
  try {
    const stage = document.getElementById("stage");
    const SPEED = 90;                // px per second. The reference video is sped up; raise this for a faster drift.
    const N = 14;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const tones = [["#2a1d14","#b98a52"],["#141c2a","#5b7fb0"],["#1d1d1d","#9a9a9a"],["#26161c","#b4687e"],["#16241d","#5f9a7c"],["#2a2414","#c4a94f"]];
    const placeholder = (i) => { const [a, b] = tones[i % tones.length];
      return `<svg viewBox="0 0 210 273" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>
        <linearGradient id="pg${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${b}" stop-opacity=".6"/><stop offset="1" stop-color="${a}"/></linearGradient></defs>
        <rect width="210" height="273" fill="url(#pg${i})"/><circle cx="105" cy="108" r="40" fill="rgba(0,0,0,.38)"/>
        <path d="M26 273c0-62 36-88 79-88s79 26 79 88z" fill="rgba(0,0,0,.38)"/></svg>`; };

    const cards = [];
    for (let i = 0; i < N; i++) {
      const c = document.createElement("div"); c.className = "card"; c.innerHTML = placeholder(i);
      stage.appendChild(c); cards.push(c);
    }
    // swap in dataset photos (carousel/1.jpg ... 16.jpg) once they are found
    const found = [];
    Promise.all(Array.from({ length: 16 }, (_, i) => new Promise((r) => {
      const im = new Image(); const u = `carousel/${i + 1}.jpg`;
      im.onload = () => { found[i] = u; r(); }; im.onerror = r; im.src = u; }))).then(() => {
      const list = found.filter(Boolean); if (!list.length) return;
      cards.forEach((c, i) => { c.innerHTML = `<img src="${list[i % list.length]}" alt="TSKinFace sample" draggable="false">`; });
    });

    let off = 0, last = performance.now(), step = 0, total = 0, half = 0;
    const measure = () => { const w = cards[0].offsetWidth; step = w * 1.14; total = N * step; half = stage.clientWidth / 2; };
    measure(); addEventListener("resize", measure);
    (function tick(t) {
      const dt = Math.min(64, t - last); last = t;
      if (half > 0) {
        if (!reduce) off = (off + dt * SPEED / 1000) % total;
        cards.forEach((c, i) => {
          let x = (((i * step - off) % total) + total) % total; if (x > total / 2) x -= total;
          const u = Math.max(-1.5, Math.min(1.5, x / half));
          c.style.transform = `translate3d(${x}px,0,${u * u * 150}px) rotateY(${-u * 20}deg)`;
        });
      } else measure();
      requestAnimationFrame(tick);
    })(last);
  } catch (e) { console.error("carousel failed", e); }
})();
</script>

<!-- ───────── 1b. page switching (plain script, so navigation works even if the app is still loading) ───────── -->
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const wrap = $("appWrap");
  // ---- page switching: page 1 = hero carousel, page 2 = the app
  const body = document.body, nHome = $("nHome"), nHow = $("nHow");
  function go(page, instant) {
    const toApp = page === "app";
    if (body.classList.contains("page-app") === toApp) return;
    const apply = () => {
      body.classList.toggle("page-app", toApp);
      nHome.classList.toggle("on", !toApp); nHow.classList.toggle("on", toApp);
      window.scrollTo(0, 0); body.classList.remove("leaving");
      dispatchEvent(new Event("resize"));
      history.replaceState(null, "", toApp ? "#app" : location.pathname + location.search);
    };
    if (instant) return apply();
    body.classList.add("leaving"); setTimeout(apply, 420);
  }
  $("nStart").onclick = () => go("app");
  nHow.onclick = () => go("app");
  nHome.onclick = () => go("home");
  $("nData").onclick = $("dataset").onclick = () => go("home");
  if (location.hash === "#app") go("app", true);

  // reveal the app once Streamlit has rendered; every step change glides back to the top
  let lastStep = 0;
  new MutationObserver(() => {
    const steps = document.querySelector(".steps"); if (!steps) return;
    wrap.classList.add("ready"); $("boot").style.display = "none";
    const n = steps.querySelectorAll("span.on").length;
    if (lastStep && n && n !== lastStep) window.scrollTo({ top: 0, behavior: "smooth" });
    if (n) lastStep = n;
  }).observe($("app"), { childList: true, subtree: true });

})();
</script>

<!-- ───────── 2. Streamlit app (loads in the background while the visitor reads the hero) ───────── -->
<script type="module">
  import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
  const $ = (id) => document.getElementById(id);

  // files for the Streamlit runtime
  const files = { "app.py": { url: "app.py" }, "model.npz": { url: "model.npz" }, "yunet.onnx": { url: "yunet.onnx" } };
  for (const n of ["father.jpg", "mother.jpg", "child.jpg"]) {
    try { const res = await fetch("examples/" + n, { method: "HEAD" }); if (res.ok) files["examples/" + n] = { url: "examples/" + n }; } catch (_) {}
  }
  mount({
    entrypoint: "app.py", requirements: ["opencv-python", "pillow"], files,
    streamlitConfig: { "theme.base": "dark", "theme.backgroundColor": "#000000", "theme.secondaryBackgroundColor": "#101012",
                       "theme.primaryColor": "#e8e4dc", "theme.textColor": "#f4f1ea", "client.toolbarMode": "minimal" },
  }, $("root"));
</script>
</body>
</html>
